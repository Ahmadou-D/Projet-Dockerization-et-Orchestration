version: '3.8'

services:
  vote:
    image: vote-app:latest 
    ports:
      - "8080:8080"
    networks:
      - front-tier
      - back-tier
    depends_on:
      - redis
    deploy:
      mode: replicated
      replicas: 2 
      restart_policy:
        condition: on-failure

  result:
    image: result-app:latest
    ports:
      - "8888:8888"
    networks:
      - front-tier
      - back-tier
    depends_on:
      - db
    deploy:
      mode: replicated
      replicas: 2 
      restart_policy:
        condition: on-failure

  worker:
    image: worker-app:latest
    networks:
      - back-tier
    depends_on:
      - redis
      - db
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - back-tier
    deploy:
      placement:
        constraints:
          - node.role == manager 

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - back-tier
    volumes:
      - db-data:/var/lib/postgresql/data
    deploy:
      placement:
        constraints:
          - node.role == manager 

networks:
  front-tier:
    driver: overlay 
  back-tier:
    driver: overlay

volumes:
  db-data: